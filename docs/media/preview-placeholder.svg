<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">摇摇乐演示素材占位图</title>
  <desc id="desc">将演示 GIF 或产品截图放入 docs/media 目录后替换此图</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182235"/>
      <stop offset="1" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9bd2ff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#4c8fc9" stop-opacity=".10"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="30" fill="url(#background)"/>
  <rect x="1" y="1" width="958" height="538" rx="29" fill="none" stroke="#9dccff" stroke-opacity=".20" stroke-width="2"/>
  <g transform="translate(137 72)">
    <path d="M122 16h124v64c0 20 70 34 84 92l10 220c1 22-13 38-36 38H64c-23 0-37-16-36-38l10-220c14-58 84-72 84-92Z" fill="url(#glass)" stroke="#a9d8ff" stroke-opacity=".55" stroke-width="4"/>
    <g fill="#b9ddff" fill-opacity=".76" stroke="#fff" stroke-opacity=".38" stroke-width="5">
      <circle cx="104" cy="318" r="42"/>
      <circle cx="184" cy="360" r="48"/>
      <circle cx="262" cy="304" r="38"/>
      <circle cx="198" cy="258" r="34"/>
    </g>
  </g>
  <g fill="#e8f4ff" font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
    <text x="682" y="214" font-size="30" font-weight="600">演示 GIF / 截图预留位</text>
    <text x="682" y="262" font-size="18" fill-opacity=".68">将素材放到 docs/media/</text>
    <text x="682" y="296" font-size="18" fill-opacity=".68">然后替换 README 中的图片地址</text>
    <rect x="568" y="334" width="228" height="50" rx="25" fill="#76baff" fill-opacity=".16" stroke="#9dccff" stroke-opacity=".36"/>
    <text x="682" y="366" font-size="17" fill-opacity=".82">推荐文件名：demo.gif</text>
  </g>
</svg>
