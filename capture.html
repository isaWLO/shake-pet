<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>选择截图区域</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; cursor: crosshair; user-select: none; }
    #shot, #shade { position: fixed; inset: 0; width: 100%; height: 100%; }
    #shot { object-fit: fill; pointer-events: none; }
    #shade { background: rgba(20, 17, 19, .46); }
    #selection { position: fixed; display: none; border: 2px solid #fff; background-repeat: no-repeat; box-shadow: 0 0 0 1px rgba(207, 120, 143, .9), 0 8px 28px rgba(0, 0, 0, .28); }
    #hint { position: fixed; top: 22px; left: 50%; padding: 8px 13px; transform: translateX(-50%); border-radius: 999px; color: #fff; background: rgba(49, 39, 43, .82); font: 12px/1.2 "Segoe UI", "Microsoft YaHei", sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <img id="shot" alt="" />
  <div id="shade"></div>
  <div id="selection"></div>
  <div id="hint">正在准备截图…</div>
  <script>
    const shot = document.querySelector('#shot');
    const selection = document.querySelector('#selection');
    let start = null;

    window.desktopPet.onCaptureSource(dataUrl => {
      shot.src = dataUrl;
      selection.style.backgroundImage = `url(${dataUrl})`;
      selection.style.backgroundSize = `${innerWidth}px ${innerHeight}px`;
      document.querySelector('#hint').textContent = '拖动选择截图区域 · Esc 取消';
    });

    function point(event) {
      return { x: event.clientX, y: event.clientY };
    }

    function draw(end) {
      const left = Math.min(start.x, end.x);
      const top = Math.min(start.y, end.y);
      const width = Math.abs(end.x - start.x);
      const height = Math.abs(end.y - start.y);
      Object.assign(selection.style, {
        display: 'block', left: `${left}px`, top: `${top}px`,
        width: `${width}px`, height: `${height}px`,
        backgroundPosition: `${-left}px ${-top}px`
      });
    }

    addEventListener('pointerdown', event => {
      if (event.button !== 0) return;
      start = point(event);
      draw(start);
    });
    addEventListener('pointermove', event => { if (start) draw(point(event)); });
    addEventListener('pointerup', event => {
      if (!start) return;
      const end = point(event);
      if (Math.abs(end.x - start.x) < 8 || Math.abs(end.y - start.y) < 8) {
        start = null;
        selection.style.display = 'none';
        return;
      }
      window.desktopPet.submitCapture({ start, end, viewportWidth: innerWidth, viewportHeight: innerHeight });
    });
    addEventListener('keydown', event => { if (event.key === 'Escape') window.desktopPet.cancelCapture(); });
    addEventListener('contextmenu', event => event.preventDefault());
  </script>
</body>
</html>
